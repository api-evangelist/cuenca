aid: cuenca
name: Cuenca
description: >-
  Cuenca is a Mexican fintech (challenger bank / neobank) founded in 2018 that
  offers a banking-as-a-service REST API for moving money in Mexico. The API at
  api.cuenca.com covers SPEI and internal transfers, deposits, CLABE account
  provisioning, debit card issuing (physical and virtual), card transactions,
  bill payments to service providers, balances, statements, commissions, and
  KYC / identity validation (CURP validation, identity verification, KYC
  checks). It authenticates with an API key plus secret (HTTP basic), optional
  short-lived JWTs, and login / session tokens, exposes a sandbox at
  sandbox.cuenca.com, signs transfers with an idempotency key, paginates with a
  cursor (next_page_uri), and pushes webhooks for transaction, card, deposit and
  user events. Official client libraries ship for Python (cuenca) and Java
  (CuencaJava), with open-source tooling for CLABE validation and CEP receipts
  under the cuenca-mx GitHub organization.
